# Project metadata (PEP 621) ===============================================
[project]
name = "FAST-OAD-core"
description = "FAST-OAD is a framework for performing rapid Overall Aircraft Design"
readme = "README.md"
license = { text = "GPL-3.0-only" }
keywords = [
    "aircraft",
    "design",
    "multi-disciplinary"
]
authors = [
    {name = "Christophe DAVID", email = "christophe.david@onera.fr"},
    {name = "Scott DELBECQ", email = "Scott.DELBECQ@isae-supaero.fr"}
]
maintainers = [
    {name = "Florent LUTZ", email = "Florent.LUTZ2@isae-supaero.fr"},
    {name = "Eric NGUYEN VAN", email = "Eric.Nguyen_Van@onera.fr"},
    {name = "Enrico STRAGIOTTI", email = "enrico.stragiotti@onera.fr"},
]
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

# User dependencies ------------------------------------------------------------
dependencies = [
    # IMPORTANT: when modifying this list, docs/requirements.txt must be updated for
    # ReadTheDocs to be able to compile the documentation.
    # A pre-commit hook has been added to do this task. As a result, any modification
    # of uv.lock file will modify docs/requirements.txt and make
    # the commit fail because "files were modified by this hook". In that case,
    # doing again the commit including changes in docs/requirements.txt will succeed.
    "numpy>=1.23.2,<3",
    "scipy>=1.11.2,<2",
    "pandas>=2.1.1,<3",
    "openmdao>=3.40,<3.46",
    "ipopo>=3.0.0,<4",
    "ipywidgets>=7.7.0,<9",
    "ipysheet>=0.5.0,<1",
    "plotly>=6.2.0,<7",
    "wop>=2.2.0,<3",
    "lxml>=4.9.3,<7",
    "tomlkit>=0.5.3,<1",
    "ruamel.yaml>=0.15.78,<0.19",
    "jsonschema>=3.2.0,<5",
    "ensure>=1.0.4,<2",
    "tabulate>=0.8.9,<1",
    "aenum>=3.1.0,<4",
    "jupyterlab>=4.2,<5",
    "stdatm>=0.4.2,<1",
    "Deprecated>=1.2.13,<2",
    "click>=8.0.3,<9",
    "pyDOE3>=1.0.0,<2",
    "rich>=14.0.0,<15",
    "anywidget>=0.9.18,<1",
    "jupyterlab-widgets==3.0.15"  # Temporarily fix for #665
]

[project.optional-dependencies]
# Activated with:
#    uv sync --extra mpi
# or, as a user:
#    pip install fast-oad-core[mpi]
mpi = ["mpi4py>=4.0.2,<5"]

[project.urls]
homepage = "https://github.com/fast-aircraft-design/FAST-OAD"
documentation = "https://fast-oad.readthedocs.io/en/stable/"

# Entry points -----------------------------------------------------------------
[project.scripts]
fastoad = "fastoad.cmd.cli:fast_oad"
fast-oad = "fastoad.cmd.cli:fast_oad"

[project.entry-points."fastoad.plugins"]
bundled = "fastoad"


[dependency-groups]
dev = [
    "fast-oad-cs25>=0.9.1,<0.10.0",
    "matplotlib>=3.9.0,<4.0.0",
]
test = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "coverage[toml]>=7.0,<8.0",
    "nbval>=0.11,<0.12",
    "wrapt>=2.0.1,<3.0.0",
]
doc = [
    "sphinx>=7.1.2",
    "sphinx-rtd-theme>=2.0",
    "sphinxcontrib-bibtex>=2.6.3,<3",
]
lint = [
    "pre-commit>=4.4.0,<5",
    "nbstripout>=0.6.0,<0.7",
    "ruff>=0.16.0,<0.17.0",
]

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fastoad"]

[tool.hatch.build]
exclude = ["**/tests/**"]

# Packaging system =============================================================
[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"


# Pytest settings ==============================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov-report term-missing --cov-report html --verbose"
testpaths = ["src"]
norecursedirs = ["dist", "build", ".tox", ".ipynb_checkpoints"]
markers = ["mpi: marks tests that use MPI"]


# Coverage settings ============================================================
[tool.coverage.run]
branch = true
source = ["fastoad"]
omit = ["*/test/*", "*/tests/*"]

# Lines below according to https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html#if-you-use-multiprocessing
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ = = .__main__.:"
]